name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: make build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  # The .deb is built on every push, not only on a tag: packaging breaks
  # quietly and finding out at release time is finding out too late.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build the package
        run: make deb

      - name: verify its contents
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb -c dist/*.deb
          # The binary must be static: the package declares no dependencies,
          # so a dynamic link would only fail on someone else's machine.
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./usr/bin/slk > /tmp/slk
          chmod +x /tmp/slk
          file /tmp/slk | grep -q "statically linked" || {
            echo "binary is not statically linked"; file /tmp/slk; exit 1;
          }
          /tmp/slk version
